[package]
name = "metamorphic-resonance-human-language-gamers"
version = "0.3.0"
description = "Change the Word Change the World"
authors = ["Plantacerium"]
license = ""
repository = "https://github.com/plantacerium/Metamorphic-Resonance-Human-Language-Gamers"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
surrealdb = { version = "2.0.2", features = ["kv-surrealkv"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
